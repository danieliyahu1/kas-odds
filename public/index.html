<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f12">
    <meta name="description" content="KasOdds — two players pick a number, the total decides who takes the pot.">
    <title>KasOdds</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="KasOdds home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span>KasOdds</span>
      </a>
      <div class="topbar-actions">
        <div class="network"><span class="pulse" aria-hidden="true"></span><span>Kaspa</span><span class="network-separator" aria-hidden="true">/</span><span id="network-label">testnet-10</span></div>
        <a class="github-button" href="https://github.com/danieliyahu1/kasodds" target="_blank" rel="noopener noreferrer" aria-label="Source code on GitHub" title="Source code on GitHub">

        </a>
        <a class="telegram-button" href="https://t.me/+myqCZcGKgX85ODRk" target="_blank" rel="noopener noreferrer" aria-label="Join the Telegram group" title="Join the Telegram group">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        </a>
        <button type="button" class="feedback-button" id="feedback-button" aria-haspopup="dialog">Feedback</button>
        <button type="button" class="wallet-button" id="wallet-button">Connect Wallet</button>
      </div>
    </header>
    <div id="wallet-notice" class="wallet-notice" role="status" aria-live="polite"></div>
    <main id="app"></main>
    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
      <form id="feedback-form" class="feedback-form" novalidate>
        <div class="feedback-head">
          <h2 id="feedback-title">Tell us anything</h2>
          <button type="button" class="feedback-close" id="feedback-close" aria-label="Close">&times;</button>
        </div>
        <label class="feedback-label" for="feedback-text">A bug, an idea, or something that felt confusing.</label>
        <textarea id="feedback-text" name="message" rows="5" maxlength="1500" placeholder="What should we improve?" aria-describedby="feedback-hint"></textarea>
        <p id="feedback-hint" class="feedback-hint">Anonymous. Sent straight to us.</p>
        <div id="feedback-note" role="status" aria-live="polite"></div>
        <div class="actions feedback-actions">
          <button type="submit" class="primary" id="feedback-send">Send feedback</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
