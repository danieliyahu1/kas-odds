# Builds the kaspa-even-odd image for linux/arm64, smoke-tests the published
# artifact, then advances the committed Deployment to the exact published image
# digest and commits that change back to main. Argo CD (oci-k3s-starter) syncs
# the cluster to Git, so `git push` to main is the deploy button. CI never talks
# to Kubernetes and holds no cluster credential.
#
# The generated manifest commit touches only deploy/deployment.yaml, which is
# excluded below, so the delivery flow terminates without a recursive run.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/deployment.yaml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Newest source push wins: obsolete in-flight builds are cancelled so the
  # latest revision is the one that publishes and advances the manifest.
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/kaspa-even-odd

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: oracle

      # Building the oracle here makes test/covenant-oracle-runtime.test.js run
      # instead of skipping, so the Rust/JS covenant cross-check is enforced.
      - name: Build covenant oracle
        run: cargo build --release --locked --manifest-path oracle/Cargo.toml

      - run: npm test

      - name: Run JavaScript coverage
        run: npm run coverage

      - name: Run Rust tests
        run: cargo test --locked --manifest-path oracle/Cargo.toml

      - name: Install kubectl
        run: |
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests
        run: kubectl kustomize deploy | kubeconform -strict -ignore-missing-schemas -summary

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write # lets CI commit the bumped image back to deploy/
      packages: write # lets GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Only the immutable sha-<commit> tag. `latest` is mutable and would
          # let Kubernetes miss a change; the digest is what gets deployed.
          tags: |
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (readiness and metrics)
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "push" ]; then docker pull "$IMAGE_REF"; fi
          docker run --detach --rm --name kaspa-even-odd -p 3000:3000 -p 9464:9464 \
            -e PORT=3000 -e METRICS_PORT=9464 -e GAME_STORE_PATH=/tmp/games.json \
            "$IMAGE_REF"
          trap 'docker stop kaspa-even-odd' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/readyz
          curl --fail --silent --show-error http://127.0.0.1:9464/metrics | grep -q kaspa_http_requests_total

      - name: Verify arm64 image manifest
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" | grep -q linux/arm64

      - name: Advance deployment manifest to the published digest
        if: github.event_name == 'push'
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE}@${{ steps.build.outputs.digest }}"
          git fetch origin "${GITHUB_REF_NAME}"
          REMOTE="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$REMOTE" != "${GITHUB_SHA}" ]; then
            echo "origin/${GITHUB_REF_NAME} advanced to ${REMOTE}; a newer source push owns deployment"
            exit 0
          fi
          sed -i -E "s|^([[:space:]]*image: )ghcr\.io/${GITHUB_REPOSITORY}/kaspa-even-odd[@:].*|\1${IMAGE_REF}|" deploy/deployment.yaml
          sed -i -E "s|^([[:space:]]*kaspa-even-odd/source-revision: ).*|\1sha-${GITHUB_SHA}|" deploy/deployment.yaml
          if git diff --quiet -- deploy/deployment.yaml; then
            echo "manifest already points at ${IMAGE_REF}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git commit -m "deploy: sha-${GITHUB_SHA}"
          # Pushing the manifest can race a concurrent run's identical commit,
          # which GitHub surfaces as "fatal error in commit_refs". Rebase onto
          # whatever advanced main and retry a few times; if another run really
          # owns the next manifest, defer to it instead of failing.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} was rejected; rebasing and retrying"
            git fetch origin "${GITHUB_REF_NAME}"
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort 2>/dev/null || true
              echo "origin/${GITHUB_REF_NAME} conflicts; a concurrent run owns deployment"
              exit 0
            fi
          done
          exit 1
