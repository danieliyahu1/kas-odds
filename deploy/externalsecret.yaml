# Maps the per-network game-fee recipient OCI Vault entries into the
# `kasodds-game-fee-address` Secret the Deployment reads. Both networks
# are always present, so switching networks needs no secret change — the process
# picks the Vault entry that matches KASPA_NETWORK. What is in Git is a NAME,
# never a value: the box proves its own identity (instance principal) to OCI and
# fetches the values at runtime.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kasodds-game-fee-address
  namespace: kasodds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kasodds-game-fee-address
    creationPolicy: Owner
  data:
    - secretKey: mainnet
      remoteRef:
        key: kasodds-game-fee-address-mainnet
    - secretKey: testnet-10
      remoteRef:
        key: kasodds-game-fee-address-testnet-10
---
# Maps the Telegram feedback bot credentials into the `kasodds-telegram`
# Secret the Deployment reads. Only the NAMEs are in Git: the token and chat id
# are fetched from the Vault at runtime and never appear in this repository or
# in browser code.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kasodds-telegram
  namespace: kasodds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kasodds-telegram
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: kasodds-telegram-bot-token
    - secretKey: chat-id
      remoteRef:
        key: kasodds-telegram-chat-id
---
# Maps the network switch (mainnet / testnet-10) from the OCI Vault entry
# `kasodds-network` into the `kasodds-network` Secret the Deployment reads, so
# switching networks on the VM is a Vault edit plus a rollout — no Git commit.
# Argo CD owns the ExternalSecret; ExternalSecrets owns the Secret data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kasodds-network
  namespace: kasodds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kasodds-network
    creationPolicy: Owner
  data:
    - secretKey: network
      remoteRef:
        key: kasodds-network
