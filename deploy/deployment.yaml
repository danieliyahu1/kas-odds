apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasodds
  namespace: kasodds
  labels:
    app.kubernetes.io/name: kasodds
  annotations:
    kasodds/source-revision: sha-8b5c4e90a3e2d1251d74dee3e3aa07f22d2fb50d
spec:
  replicas: 1
  # The game store is a single JSON file with process-local write locking, so two
  # pods must never share the RWO volume during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kasodds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasodds
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kasodds
          image: ghcr.io/danieliyahu1/kas-odds/kasodds@sha256:4244e02db2e1920944e6ac5e75f8d33f4498e7762d30d4d737d6bffe2b7a8a81
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          env:
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: "9464"
            # The single switch between networks: the address prefix, KasWare
            # network, wRPC node, store file, and fee wallet all follow from it.
            # The value is read at runtime from the kasodds-network Secret
            # (Vault entry `kasodds-network`), so switching networks on the VM
            # needs no Git commit.
            - name: KASPA_NETWORK
              valueFrom:
                secretKeyRef:
                  name: kasodds-network
                  key: network
            - name: GAME_STORE_DIR
              value: /var/lib/kasodds
            - name: GAME_FEE_ADDRESS_MAINNET
              valueFrom:
                secretKeyRef:
                  name: kasodds-game-fee-address
                  key: mainnet
            - name: GAME_FEE_ADDRESS_TESTNET_10
              valueFrom:
                secretKeyRef:
                  name: kasodds-game-fee-address
                  key: testnet-10
            - name: FEEDBACK_SPILL_PATH
              value: /var/lib/kasodds/feedback-spill.json
            - name: TELEGRAM_FEEDBACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kasodds-telegram
                  key: bot-token
                  optional: true
            - name: TELEGRAM_FEEDBACK_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: kasodds-telegram
                  key: chat-id
                  optional: true
            # The fallback bot is optional: when the Secret is absent the key is
            # unset and the bot stays off. It holds a funded server-side key, so
            # the value is only ever in the Vault, never in Git. Only the
            # mainnet entry is mapped here — on testnet-10 the variable stays
            # unset and the bot is not offered.
            - name: BOT_PRIVATE_KEY_MAINNET
              valueFrom:
                secretKeyRef:
                  name: kasodds-bot
                  key: mainnet
                  optional: true
          volumeMounts:
            - name: game-state
              mountPath: /var/lib/kasodds
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: game-state
          persistentVolumeClaim:
            claimName: kasodds-state
