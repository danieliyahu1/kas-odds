apiVersion: v1
kind: ConfigMap
metadata:
  name: kasodds-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kasodds
data:
  kasodds.json: |
    {
      "title": "KasOdds",
      "uid": "kasodds",
      "tags": ["kasodds"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 12,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Homepage entered",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kasodds_page_visits_total[$__range]))", "legendFormat": "homepage visits" }
          ]
        },
        {
          "id": 2,
          "title": "Find a rival",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/matchmaking/join\"}[$__range]))", "legendFormat": "find a rival clicks" }
          ]
        },
        {
          "id": 3,
          "title": "Play a friend",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/games/prepare\"}[$__range]))", "legendFormat": "play a friend clicks" }
          ]
        },
        {
          "id": 5,
          "title": "Play the bot",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/matchmaking/:id/bot\"}[$__range]))", "legendFormat": "play the bot clicks" }
          ]
        },
        {
          "id": 4,
          "title": "Visitors per API",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kasodds_page_visits_total[$__rate_interval])) or vector(0)", "legendFormat": "homepage" },
            { "refId": "B", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/matchmaking/join\"}[$__rate_interval])) or vector(0)", "legendFormat": "find a rival" },
            { "refId": "C", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/games/prepare\"}[$__rate_interval])) or vector(0)", "legendFormat": "play a friend" },
            { "refId": "D", "expr": "sum(increase(kasodds_http_requests_total{route=\"/api/matchmaking/:id/bot\"}[$__rate_interval])) or vector(0)", "legendFormat": "play the bot" }
          ]
        }
      ]
    }
