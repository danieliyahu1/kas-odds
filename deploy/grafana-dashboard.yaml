apiVersion: v1
kind: ConfigMap
metadata:
  name: kaspa-even-odd-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kaspa-even-odd
data:
  kaspa-even-odd.json: |
    {
      "title": "Kaspa Even/Odd",
      "uid": "kaspa-even-odd",
      "tags": ["kaspa-even-odd"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "HTTP request rate by route",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (route) (rate(kaspa_http_requests_total[$__rate_interval]))", "legendFormat": "{{route}}" }
          ]
        },
        {
          "id": 2,
          "title": "HTTP error rate by status",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (status) (rate(kaspa_http_errors_total[$__rate_interval]))", "legendFormat": "{{status}}" }
          ]
        },
        {
          "id": 3,
          "title": "HTTP request p95 latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(kaspa_http_request_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p95" }
          ]
        },
        {
          "id": 4,
          "title": "Kaspa wRPC calls by outcome",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (operation, outcome) (rate(kaspa_rpc_requests_total[$__rate_interval]))", "legendFormat": "{{operation}} {{outcome}}" }
          ]
        },
        {
          "id": 5,
          "title": "Backend store operations by outcome",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (operation, outcome) (rate(kaspa_storage_operations_total[$__rate_interval]))", "legendFormat": "{{operation}} {{outcome}}" }
          ]
        },
        {
          "id": 6,
          "title": "Matchmaking backlog and relay entries",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "kaspa_matchmaking_waiting", "legendFormat": "waiting matches" },
            { "refId": "B", "expr": "kaspa_relay_entries", "legendFormat": "relay entries" }
          ]
        },
        {
          "id": 7,
          "title": "Resident memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "kaspa_process_resident_memory_bytes", "legendFormat": "rss" }
          ]
        },
        {
          "id": 8,
          "title": "Game lifecycle events",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (event) (increase(kaspa_game_events_total[$__rate_interval]))", "legendFormat": "{{event}}" }
          ]
        },
        {
          "id": 9,
          "title": "Homepage visits (24h)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kaspa_page_visits_total[$__range]))", "legendFormat": "homepage visits" }
          ]
        },
        {
          "id": 10,
          "title": "Homepage visit rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(kaspa_page_visits_total[$__rate_interval]))", "legendFormat": "visits/s" }
          ]
        }
      ]
    }
