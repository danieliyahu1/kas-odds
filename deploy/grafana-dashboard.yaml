apiVersion: v1
kind: ConfigMap
metadata:
  name: kaspa-even-odd-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kaspa-even-odd
data:
  kaspa-even-odd.json: |
    {
      "title": "Kaspa Even/Odd",
      "uid": "kaspa-even-odd",
      "tags": ["kaspa-even-odd"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 8,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Homepage entered",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kaspa_page_visits_total[$__range]))", "legendFormat": "homepage visits" }
          ]
        },
        {
          "id": 2,
          "title": "Find a rival",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kaspa_http_requests_total{route=\"/api/matchmaking/join\"}[$__range]))", "legendFormat": "find a rival clicks" }
          ]
        },
        {
          "id": 3,
          "title": "Play a friend",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kaspa_http_requests_total{route=\"/api/games/prepare\"}[$__range]))", "legendFormat": "play a friend clicks" }
          ]
        },
        {
          "id": 4,
          "title": "Visitors per API",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "rate(kaspa_page_visits_total[$__rate_interval])", "legendFormat": "homepage" },
            { "refId": "B", "expr": "rate(kaspa_http_requests_total{route=\"/api/matchmaking/join\"}[$__rate_interval])", "legendFormat": "find a rival" },
            { "refId": "C", "expr": "rate(kaspa_http_requests_total{route=\"/api/games/prepare\"}[$__rate_interval])", "legendFormat": "play a friend" }
          ]
        }
      ]
    }
